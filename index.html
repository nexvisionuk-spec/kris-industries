<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kris Fuel Ops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Flat utilitarian ops tool: sidebar + content shell for Owner; phone frames for Driver/Customer. Borders not shadows, no gradients. */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --surface-2:#f2f3f5; --surface-3:#e9ebee;
  --ink:#1b1e22; --muted:#616871; --faint:#9298a0; --line:#e4e6ea; --line-2:#d3d7dd;
  --brand:#0b5fd0; --brand-strong:#0a4fb0; --brand-soft:#e9f1fd; --primary:#0b5fd0; --primary-ink:#ffffff; --link:#0b5fd0;
  --ok:#1f844a; --ok-bg:#eaf3ec; --warn:#a76316; --warn-bg:#f4ecdf; --crit:#bd3a32; --crit-bg:#f5e5e3;
  --map-water:#aacfe6; --map-land:#edeae1; --map-green:#d6e5c8; --map-road:#ffffff; --map-road2:#e5e1d5; --map-route:#0b5fd0; --map-label:#58666f;
  --r:6px; --r-sm:4px;
  --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1a1e23; --surface-2:#20252b; --surface-3:#272d34;
  --ink:#e6e8eb; --muted:#99a1aa; --faint:#69717a; --line:#2a2f36; --line-2:#3a414a;
  --brand:#3f86ee; --brand-strong:#5a98f0; --brand-soft:#15263c; --primary:#3f86ee; --primary-ink:#ffffff; --link:#6196ee;
  --ok:#33b06c; --ok-bg:#16291f; --warn:#d49242; --warn-bg:#2e2615; --crit:#e2655d; --crit-bg:#331d1b;
  --map-water:#122230; --map-land:#1e262d; --map-green:#1d2d26; --map-road:#3a434d; --map-road2:#2b343d; --map-route:#3f86ee; --map-label:#8a98a3;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1a1e23; --surface-2:#20252b; --surface-3:#272d34;
  --ink:#e6e8eb; --muted:#99a1aa; --faint:#69717a; --line:#2a2f36; --line-2:#3a414a;
  --brand:#3f86ee; --brand-strong:#5a98f0; --brand-soft:#15263c; --primary:#3f86ee; --primary-ink:#ffffff; --link:#6196ee;
  --ok:#33b06c; --ok-bg:#16291f; --warn:#d49242; --warn-bg:#2e2615; --crit:#e2655d; --crit-bg:#331d1b;
  --map-water:#122230; --map-land:#1e262d; --map-green:#1d2d26; --map-road:#3a434d; --map-road2:#2b343d; --map-route:#3f86ee; --map-label:#8a98a3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:12.5px}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:41;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:0;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;height:52px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;flex:none;white-space:nowrap}
.brand .logo{width:26px;height:26px;border-radius:5px;flex:none}
.brand .v{font-size:10.5px;color:var(--faint);font-weight:500;font-family:var(--mono);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.spacer{flex:1}
.tabs{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden}
.tabs button{border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500;font-size:13px;padding:7px 14px;display:flex;align-items:center;gap:7px}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);font-weight:600}
.iconbtn{position:relative;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center}
.badge{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--crit);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;font-family:var(--mono);border:1.5px solid var(--surface)}
@media (max-width:460px){.brand span:not(.v){display:none}.brand .v{display:none}.tabs button{padding:7px 11px}}

main{max-width:1200px;margin:0 auto;padding-block:16px 60px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

.note{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 12px;margin-bottom:16px;font-size:12.5px;color:var(--muted)}
.note button{margin-left:auto;border:0;background:transparent;color:var(--link);font-weight:600;font-size:12.5px;flex:none}

/* ---- notifications dropdown ---- */
.notif{position:fixed;top:calc(52px + env(safe-area-inset-top,0px) + 6px);right:max(14px,env(safe-area-inset-right,0px));
  width:320px;max-width:88vw;z-index:55;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.notif .nh{padding:10px 13px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.notif .nlist{max-height:340px;overflow:auto}
.notif .ni{display:flex;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.notif .ni:last-child{border-bottom:0}
.notif .ni .ic{color:var(--muted);margin-top:1px;width:14px;height:14px}
.notif .ni .tm{color:var(--faint);font-family:var(--mono);font-size:10.5px;margin-top:3px}

/* ---- owner shell ---- */
.shell{display:grid;grid-template-columns:192px 1fr;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:1px;position:sticky;top:76px}
.side .nav{border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;font-size:13.5px;width:100%}
.side .nav .ic{color:var(--faint)}
.side .nav[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.side .nav[aria-current="true"] .ic{color:var(--brand)}
.side .nav .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--crit);font-weight:600}
.side .lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 10px 5px}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:4px;gap:2px}
  .side .lbl{display:none} .side .nav{width:auto;white-space:nowrap}
  .side .nav .count{margin-left:6px}
}

.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 14px}
.panel-h h2{font-size:17px;letter-spacing:-.01em}
.panel-h .meta{font-size:12px;color:var(--faint);font-family:var(--mono)}

.block{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:16px}
.block>.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.block>.bh h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.block>.bh h3 .ic{color:var(--muted)}
.block>.bd{padding:14px}
.block>.bd.flush{padding:0}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.stat{padding:13px 15px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.stat .v small{font-size:12px;color:var(--faint);font-weight:500}
.stat .d{font-size:11px;color:var(--faint);margin-top:2px}
.stat.warn .v{color:var(--crit)} .stat.good .v{color:var(--ok)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.stats.s3{grid-template-columns:repeat(3,1fr)}.stat:nth-child(2):not(.s3 .stat){border-right:0}}

/* status pill */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.st .d{width:6px;height:6px;border-radius:50%;flex:none}
.st[data-s="pending"] .d{background:var(--crit)} .st[data-s="pending"]{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line-2));background:var(--crit-bg)}
.st[data-s="scheduled"] .d{background:var(--link)}
.st[data-s="in_transit"] .d{background:var(--warn)} .st[data-s="in_transit"]{color:var(--warn)}
.st[data-s="delivered"] .d{background:var(--ok)} .st[data-s="delivered"]{color:var(--ok)}
.pill-paid{color:var(--ok);font-weight:600;font-size:11.5px} .pill-due{color:var(--crit);font-weight:600;font-size:11.5px}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:9px 14px;border-bottom:1px solid var(--line-2);background:var(--surface-2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td .oid{font-family:var(--mono);font-size:12px;color:var(--muted)}
td .cust{font-weight:600} td .seg{font-size:11.5px;color:var(--faint);margin-top:1px}

/* dispatch */
.disp{display:flex;flex-direction:column}
.disp .item{padding:13px 14px;border-bottom:1px solid var(--line)}
.disp .item:last-child{border-bottom:0}
.disp .t{display:flex;justify-content:space-between;gap:10px;align-items:start}
.disp .cust{font-weight:600}
.disp .row{display:flex;gap:8px;margin-top:11px}
.disp select{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:7px 9px;font-family:inherit;font-size:13px}
.empty{padding:22px 14px;text-align:center;color:var(--faint);font-size:12.5px}

/* buttons */
.btn{border:1px solid var(--primary);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:13px;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.block{width:100%}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tanks */
.tank{padding:13px 14px;border-bottom:1px solid var(--line)}
.tank:last-child{border-bottom:0}
.tank .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.tank .nm{font-weight:600;font-size:13.5px}
.tank .nm small{color:var(--faint);font-weight:500;margin-left:6px}
.tank .pct{font-family:var(--mono);font-weight:600}
.meter{height:8px;background:var(--surface-3);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.meter>span{display:block;height:100%;background:var(--ink)}
.tank.low .meter>span{background:var(--crit)} .tank.low .pct{color:var(--crit)}
.tank .sub{font-size:11.5px;color:var(--faint);margin-top:5px;font-family:var(--mono)}

/* report bars */
.bars{display:flex;flex-direction:column;gap:13px}
.bars .b .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.bars .b .t b{font-weight:600}
.bars .b .t .n{font-family:var(--mono);color:var(--muted)}
.track2{height:10px;background:var(--surface-3);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.track2>span{display:block;height:100%;background:var(--ink)}
.cmeter{width:130px}.cmeter .track2{height:6px}

/* map */
.mapwrap{position:relative;line-height:0}
.routemap{width:100%;height:auto;display:block;background:var(--map-land);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.routemap.grabbing{cursor:grabbing}
.routemap .bld{fill:var(--map-road2);opacity:.55}
.maphint{position:absolute;bottom:9px;right:10px;font-size:9px;color:var(--map-label);opacity:.85;background:color-mix(in srgb,var(--surface) 72%,transparent);padding:2px 7px;border-radius:3px;line-height:1}
.routemap .water{fill:var(--map-water)}
.routemap .green{fill:var(--map-green)}
.routemap .rd{stroke:var(--map-road);fill:none;stroke-linecap:round;stroke-linejoin:round}
.routemap .rd2{stroke:var(--map-road2);fill:none;stroke-linecap:round;stroke-linejoin:round}
.routemap .rte{stroke:var(--map-route);fill:none;stroke-linecap:round}
.routemap .mk-s{fill:var(--surface)} .routemap .mk-r{fill:var(--map-route)} .routemap .mk-d{fill:var(--ok)}
.routemap .truck-i{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.routemap .veh-puck{fill:var(--surface);stroke:var(--map-route);stroke-width:2.5}
.routemap .veh-ic{fill:none;stroke:var(--map-route);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.routemap .veh-disc{fill:var(--map-route);stroke:#fff;stroke-width:2.5}
.routemap .veh-arrow{fill:#fff}
.routemap .veh-pulse{fill:var(--map-route);opacity:.3;transform-box:fill-box;transform-origin:center;animation:vehpulse 2.1s ease-out infinite}
@keyframes vehpulse{0%{transform:scale(1);opacity:.35}70%{transform:scale(2.3);opacity:0}100%{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.routemap .veh-pulse{animation:none;opacity:.18}}
.routemap .lbl{fill:var(--map-label);font-family:var(--font);font-size:11px;font-weight:600}
.routemap .lbl-w{fill:var(--map-label);font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:.14em;opacity:.7}
.routemap .lbl-sm{fill:var(--map-label);font-family:var(--font);font-size:8.5px;font-weight:500;opacity:.85}
.mapctrl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden}
.mapctrl button{border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--muted);width:28px;height:28px;font-size:16px;line-height:1;display:grid;place-items:center}
.mapctrl button:last-child{border-bottom:0}
.mapscale{position:absolute;bottom:9px;left:10px;font-size:9px;color:var(--map-label);font-family:var(--mono);display:flex;align-items:center;gap:5px;line-height:1}
.mapscale i{display:block;width:44px;height:5px;border:1px solid var(--map-label);border-top:0}
.mapbadge{position:absolute;top:10px;left:10px;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 9px;font-size:11px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;line-height:1}
.mapbadge .ic{width:13px;height:13px;color:var(--map-route)}
/* real Leaflet map (live demo loads real Corentyne tiles) */
.lmap{width:100%;height:360px;background:var(--map-land);z-index:0}
@media(max-width:560px){.lmap{height:300px}}
.leaflet-container{font-family:var(--font);background:var(--map-land)}
.leaflet-container a{color:var(--muted)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 82%,transparent)!important;color:var(--faint)!important;font-size:9px;padding:1px 6px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-control-scale-line{background:color-mix(in srgb,var(--surface) 72%,transparent);color:var(--map-label);border-color:var(--map-label);box-shadow:none}
.lm-depot{width:15px;height:15px;background:var(--map-route);border:2px solid #fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.lm-pin{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.lm-puck{position:relative;width:34px;height:34px}
.lm-pulse{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--map-route);opacity:.3;animation:lmpulse 2.1s ease-out infinite;pointer-events:none}
.lm-disc{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--map-route);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer}
.lm-disc svg{width:15px;height:15px}
@keyframes lmpulse{0%{transform:scale(1);opacity:.35}70%{transform:scale(2.3);opacity:0}100%{transform:scale(2.3);opacity:0}}
@media(prefers-reduced-motion:reduce){.lm-pulse{animation:none;opacity:.2}}
.leaflet-tooltip.lm-tt{background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:11px;padding:2px 7px;white-space:nowrap}
.leaflet-tooltip.lm-tt:before{display:none}
.trip-foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:11px 14px;border-top:1px solid var(--line)}
.trip-foot .ic{color:var(--muted)}

/* attention list */
.att{display:flex;flex-direction:column}
.att .r{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.att .r:last-child{border-bottom:0}
.att .r .ic{flex:none}
.att .r .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted)}
.att .r.crit .ic{color:var(--crit)} .att .r.warn .ic{color:var(--warn)}

/* ---- phone frame ---- */
.stage{display:flex;justify-content:center;padding-top:4px}
.phone{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line-2);border-radius:26px;overflow:hidden}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 20px 4px;font-size:12px;font-weight:600;color:var(--muted);font-family:var(--mono)}
.sbar .r{display:flex;gap:7px;align-items:center}.sbar .r .ic{width:14px;height:14px;color:var(--muted)}
.ptop{padding:3px 16px 13px;border-bottom:1px solid var(--line)}
.ptop h3{font-size:16px;letter-spacing:-.01em}
.ptop .who{font-size:12px;color:var(--muted);margin-top:3px}
.pbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.group-lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}

.job{border:1px solid var(--line);border-radius:var(--r);padding:12px}
.job .jt{display:flex;justify-content:space-between;gap:8px;align-items:start}
.job .stop{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.job .cust{font-weight:600;font-size:14.5px;margin-top:2px}
.job .prod{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.job .addr{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:7px;align-items:start}
.job .addr .ic{color:var(--faint);margin-top:1px}
.job .jf{display:flex;gap:8px;margin-top:12px}
.job.done{background:var(--surface-2)}
.job .proof{font-size:12px;color:var(--ok);margin-top:8px;display:flex;gap:7px;align-items:center}

.callout{border:1px solid var(--line);border-left:3px solid var(--link);border-radius:var(--r);padding:11px 12px;background:var(--surface-2)}
.callout .h{font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.callout .h .ic{color:var(--link)}
.callout p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.hr{height:1px;background:var(--line)}

/* fields */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:9px 10px;font-family:inherit;font-size:14px;width:100%}
.field .hint{font-size:11.5px;color:var(--faint)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 4px;font-size:12.5px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:13px}
.total .l{font-size:13px;color:var(--muted)} .total .v{font-family:var(--mono);font-weight:600;font-size:17px}

.prices .pr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prices .pr:first-child{border-top:0}
.prices .nm{font-weight:600;font-size:13.5px}.prices .nm small{display:block;color:var(--faint);font-weight:500;font-size:11.5px}
.prices .v{font-family:var(--mono);font-weight:600}.prices .v small{color:var(--faint);font-weight:500}

/* tracking */
.track{display:flex;flex-direction:column;padding-left:2px}
.track .s{display:flex;gap:11px;padding-bottom:13px;position:relative}
.track .s:last-child{padding-bottom:0}
.track .s .dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--line-2);background:var(--surface);z-index:1;display:grid;place-items:center}
.track .s .dot .ic{width:9px;height:9px;color:#fff}
.track .s.done .dot{background:var(--ok);border-color:var(--ok)}
.track .s.now .dot{background:var(--warn);border-color:var(--warn)}
.track .s::before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:2px;background:var(--line-2)}
.track .s:last-child::before{display:none}
.track .s.done::before{background:var(--ok)}
.track .s .lbl{font-size:13px;font-weight:600}
.track .s.pending .lbl{color:var(--faint);font-weight:500}

.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .oid{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.mrow .mi{font-weight:600;font-size:13px}
.mrow .ms{font-size:11.5px;color:var(--faint)}

/* delivery sheet */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;border:1px solid var(--line-2);
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.overlay{align-items:center}.sheet{border-radius:12px}}
.sheet .sh-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:3px}
.sheet h3{font-size:16px}
.sheet .x{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);width:28px;height:28px;border-radius:var(--r-sm);font-size:16px;flex:none}
.sheet .sh-sub{color:var(--muted);font-size:12.5px;margin-bottom:15px}
.flabel{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:6px}
.sig{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2);position:relative;height:120px;overflow:hidden}
.sig canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sig .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12.5px;pointer-events:none}
.sig-act{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.link{border:0;background:transparent;color:var(--link);font-weight:600;font-size:12.5px;padding:0}
.photo{border:1px dashed var(--line-2);background:var(--surface-2);color:var(--muted);border-radius:var(--r);padding:15px;width:100%;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px}
.photo .ic{color:var(--muted)}
.photo-ok{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-radius:var(--r);padding:12px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:12.5px}
.photo-ok .ic{color:var(--ok)}
.dl-input{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:10px;font-family:var(--mono);font-size:16px;font-weight:600;width:100%}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);z-index:80;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;max-width:90vw;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ic{color:var(--ok)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* phone bottom nav + deeper app screens */
.pnav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.pnav button{flex:1;border:0;background:transparent;color:var(--faint);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
.pnav button .ic{width:19px;height:19px}
.pnav button[aria-current="true"]{color:var(--brand)}
.pnav button[aria-current="true"] .ic{color:var(--map-route)}
.dstats{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dstats .d{flex:1;padding:10px 6px;border-right:1px solid var(--line);text-align:center}
.dstats .d:last-child{border-right:0}
.dstats .v{font-family:var(--mono);font-weight:600;font-size:16px}
.dstats .l{font-size:9px;letter-spacing:.04em;color:var(--muted);margin-top:2px}
.contact{display:flex;gap:7px;margin-top:10px}
.contact .cbtn{flex:1;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.contact .cbtn .ic{width:14px;height:14px;color:var(--muted)}
.instr{font-size:12px;color:var(--muted);margin-top:8px;background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;display:flex;gap:7px}
.instr .ic{color:var(--warn);width:14px;height:14px;flex:none;margin-top:1px}
.chat{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
.msg{max-width:82%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.4}
.msg.them{background:var(--surface-3);align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--map-route);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg .tm{font-size:9.5px;opacity:.7;margin-top:3px;font-family:var(--mono)}
.chatbar{display:flex;gap:7px}
.chatbar input{flex:1;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:20px;padding:9px 13px;font-family:inherit;font-size:13px}
.chatbar .sb{border:0;background:var(--map-route);color:#fff;width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center}
.check{display:flex;flex-direction:column}
.check label{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.check label:first-child{border-top:0}
.check input{width:18px;height:18px;accent-color:var(--map-route);flex:none}
.prof{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.prof .avatar{width:52px;height:52px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--muted);flex:none}
.prof .nm{font-weight:600;font-size:16px}.prof .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-child{border-top:0}.kv .k{color:var(--muted)}.kv .vv{font-weight:600;text-align:right}
.site{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.site:first-child{border-top:0}.site>.ic{color:var(--muted);flex:none}.site .nm{font-weight:600}.site .rg{font-size:11.5px;color:var(--faint)}
.site .def{margin-left:auto;font-size:10px;font-weight:600;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:1px 6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{width:40px;height:23px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line-2);position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--map-route);border-color:var(--map-route)}
.sw[aria-pressed="true"]::after{left:19px;background:#fff}
.datebtns{display:flex;gap:7px}
.datebtns button{flex:1;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:9px 4px;font-size:12.5px;font-weight:600}
.datebtns button[aria-pressed="true"]{border-color:var(--map-route);background:var(--surface-3)}
.selectable{font-family:var(--mono);font-size:12.5px;color:var(--ink);-webkit-user-select:all;user-select:all}
.avatar.sm{width:38px;height:38px;font-size:14px}
.tcwrap{padding:13px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tc-driver{display:flex;align-items:center;gap:10px}
.tc-driver .nm{font-weight:600;font-size:14px}.tc-driver .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.tc-eta{text-align:right}.tc-eta .v{font-family:var(--mono);font-weight:600;font-size:16px}.tc-eta .l{font-size:10.5px;color:var(--faint)}
.tc-bar{height:7px;background:var(--surface-3);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tc-bar>span{display:block;height:100%;background:var(--map-route)}
.tc-meta{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted)}.tc-meta .ic{color:var(--map-route);width:14px;height:14px;flex:none}
.trip-eta{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.trip-eta .big{font-family:var(--mono);font-size:24px;font-weight:600}.trip-eta>.ic{color:var(--map-route);width:26px;height:26px}

/* auth / onboarding */
.authtop{background:var(--brand);color:#fff;padding:24px 20px 20px;position:relative;overflow:hidden}
.authtop .logo2{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;position:relative;z-index:1}
.authtop .logo2 .mk{width:30px;height:30px;border-radius:7px;background:#fff;display:grid;place-items:center;flex:none}
.authtop .tag{font-size:12.5px;opacity:.9;margin-top:9px;position:relative;z-index:1}
.authtop .motif{position:absolute;right:-18px;bottom:-30px;opacity:.16;color:#fff}
.authbody{padding:18px 18px 22px;display:flex;flex-direction:column;gap:13px}
.authbody h2{font-size:19px;letter-spacing:-.01em}
.authbody .lead{font-size:13px;color:var(--muted);margin-top:-7px}
.authlink{text-align:center;font-size:13px;color:var(--muted)}
.authlink b{color:var(--brand);font-weight:600;cursor:pointer}
.authhint{text-align:center;font-size:11.5px;color:var(--faint);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:8px 10px}
.stepper{display:flex;gap:6px}
.stepper .s{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.stepper .s.on{background:var(--brand)}
.review{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:2px 12px}
.ownerauth{display:grid;grid-template-columns:1.05fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);min-height:434px}
.ownerauth .brandpanel{background:var(--brand);color:#fff;padding:34px 30px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.ownerauth .brandpanel .logo2{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;position:relative;z-index:1}
.ownerauth .brandpanel .mk{width:34px;height:34px;border-radius:8px;background:#fff;display:grid;place-items:center}
.ownerauth .brandpanel .pitch{font-size:23px;font-weight:600;line-height:1.3;position:relative;z-index:1;letter-spacing:-.015em}
.ownerauth .brandpanel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.ownerauth .brandpanel li{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.95}
.ownerauth .brandpanel li .ic{width:16px;height:16px}
.ownerauth .brandpanel .motif{position:absolute;right:-34px;bottom:-44px;opacity:.14;color:#fff}
.ownerauth .formpanel{padding:34px 30px;display:flex;flex-direction:column;justify-content:center;gap:13px}
.ownerauth .formpanel h2{font-size:20px;letter-spacing:-.01em}
@media(max-width:680px){.ownerauth{grid-template-columns:1fr}.ownerauth .brandpanel{padding:24px;gap:18px}}
.rsum{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:center;margin-bottom:14px}
.rsum .big{font-family:var(--mono);font-size:24px;font-weight:600}
.rsum .sub{font-size:12px;color:var(--muted);margin-top:3px}
.stars{display:flex;gap:6px;justify-content:center;margin:8px 0 14px}
.stars .star{border:0;background:transparent;padding:2px;cursor:pointer;line-height:0}
.stars .star svg{width:30px;height:30px;fill:var(--line-2)}
.stars .star.on svg{fill:#f4a51f}
.rowbtns{display:flex;gap:6px}
.livepill{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok)}
.livepill .ld{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:aipulse 1.5s infinite}
/* ---------- AI call agent ---------- */
.ai-wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ai-hero{text-align:center;padding:4px 6px}
.ai-tagpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--brand);border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;margin-bottom:10px}
.ai-tagpill .ic{width:15px;height:15px}
.ai-hero h2{margin:0 0 7px;font-size:23px;letter-spacing:-.02em}
.ai-hero p{margin:0 auto;max-width:560px;color:var(--muted);font-size:14px;line-height:1.55}
.ai-stage{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ai-top{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ai-ava{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.ai-ava .ic{width:20px;height:20px}
.ai-top .nm{font-weight:650;font-size:14px}
.ai-top .sub{font-size:12px;color:var(--muted)}
.ai-live{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:aipulse 1.5s infinite}
@keyframes aipulse{0%{box-shadow:0 0 0 0 rgba(40,167,69,.5)}70%{box-shadow:0 0 0 7px rgba(40,167,69,0)}100%{box-shadow:0 0 0 0 rgba(40,167,69,0)}}
.ai-incoming{padding:30px 20px 26px;text-align:center}
.ai-bigava{position:relative;width:88px;height:88px;border-radius:50%;margin:0 auto 18px;background:var(--brand);color:#fff;display:grid;place-items:center}
.ai-bigava .ic{width:34px;height:34px}
.ai-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);opacity:.45;animation:airing 1.9s ease-out infinite}
.ai-ring.r2{animation-delay:.95s}
@keyframes airing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.9);opacity:0}}
.ai-callname{font-size:20px;font-weight:650}
.ai-callsub{font-size:13px;color:var(--muted);margin-top:3px}
.ai-inclabel{font-size:12.5px;color:var(--faint);margin-top:9px;font-family:var(--mono)}
.ai-callbtns{display:flex;justify-content:center;gap:46px;margin-top:22px}
.ai-callbtns>div{display:flex;flex-direction:column;align-items:center;gap:7px}
.ai-cb{width:60px;height:60px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff}
.ai-cb .ic{width:25px;height:25px}
.ai-cb.ans{background:var(--ok)}
.ai-cb.dec{background:var(--crit)}
.ai-cb.dec .ic{transform:rotate(135deg)}
.ai-cblabel{font-size:12px;color:var(--muted)}
.ai-scenarios{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.ai-chip{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.ai-chip[aria-pressed="true"]{border-color:var(--brand);background:var(--surface-3);color:var(--ink);font-weight:600}
.ai-hint{font-size:12.5px;color:var(--faint);margin-top:14px}
.ai-convo{padding:16px;display:flex;flex-direction:column;gap:11px;max-height:46vh;overflow:auto}
.ai-msg{max-width:84%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;animation:aifade .25s ease}
.ai-msg .who{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.6;margin-bottom:3px;font-weight:700}
.ai-msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--ink)}
.ai-msg.caller{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.ai-msg.caller .who{opacity:.75}
@keyframes aifade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ai-wave{display:inline-flex;gap:2.5px;align-items:center;height:12px;margin-left:5px;vertical-align:middle}
.ai-wave i{width:3px;height:100%;background:currentColor;border-radius:2px;opacity:.75;animation:aiwave .9s ease-in-out infinite}
.ai-wave i:nth-child(2){animation-delay:.15s}.ai-wave i:nth-child(3){animation-delay:.3s}.ai-wave i:nth-child(4){animation-delay:.45s}.ai-wave i:nth-child(5){animation-delay:.6s}
@keyframes aiwave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.ai-ctrls{display:flex;gap:9px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.ai-endbtn{background:var(--crit);border-color:var(--crit);color:#fff}
.ai-endbtn .ic{transform:rotate(135deg)}
.ai-end{padding:28px 22px;text-align:center}
.ai-check{width:52px;height:52px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.ai-check .ic{width:28px;height:28px;stroke-width:2.2}
.ai-end h3{margin:0 0 5px;font-size:19px}
.ai-callmeta{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.ai-outcome{display:inline-flex;align-items:center;gap:9px;margin:16px auto 0;padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-weight:600;font-size:14px}
.ai-outcome .ic{color:var(--brand);width:18px;height:18px}

function initSig(){

  var drawing=false,last=null;
  function pos(e){var r=cv.getBoundingClientRect();var cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;var cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return {x:cx*(cv.width/r.width),y:cy*(cv.height/r.height)};}
  function down(e){drawing=true;last=pos(e);var ph=document.getElementById("sigph");if(ph)ph.style.display="none";if(sheetState)sheetState.hasSig=true;e.preventDefault();}
  function move(e){if(!drawing)return;var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault();}
  cv.addEventListener("pointerdown",down);cv.addEventListener("pointermove",move);window.addEventListener("pointerup",function(){drawing=false;});
}

function renderAgent(){

function agentSpeak(text,done){
  if(agentState.muted||!('speechSynthesis'in window)){agentState.timer=setTimeout(done,Math.min(5600,900+text.length*42));return;}
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text),v=agentPickVoice();
    if(v){u.voice=v;u.lang=v.lang;}else{u.lang="en-GB";}
    u.rate=1.03;u.pitch=1.0;u.volume=1;
    var fired=false,fin=function(){if(fired)return;fired=true;done();};
    u.onend=fin;u.onerror=fin;
    window.speechSynthesis.speak(u);
    agentState.timer=setTimeout(function(){if(fired)return;fired=true;try{window.speechSynthesis.cancel();}catch(e){}done();},Math.min(16000,2000+text.length*95));
  }catch(e){agentState.timer=setTimeout(done,1600);}
}
function agentPlayStep(){
  var L=agentScript(agentState.scenario).lines;
  if(agentState.idx>=L.length){agentEnd();return;}
  renderAgent();
  var ln=L[agentState.idx],myToken=++agentState.token;
  var done=function(){if(agentState.token!==myToken)return;agentState.token++;agentState.idx++;agentPlayStep();};
  if(ln.s==="ai")agentSpeak(ln.t,done);
  else agentState.timer=setTimeout(done,Math.min(4200,700+ln.t.length*33));
}
function agentAnswer(){
  try{if('speechSynthesis'in window)window.speechSynthesis.getVoices();}catch(e){}
  if(agentState.scenario==="order")agentState.orderId="KI-"+(seq++);
  agentState.committed=false;agentState.phase="live";agentState.idx=0;agentState.started=Date.now();
  if(agentState.tick)clearInterval(agentState.tick);agentState.tick=setInterval(agentUpdateTimer,1000);
  agentPlayStep();
}
function agentSkip(){
  agentState.token=(agentState.token||0)+1;
  if(agentState.timer){clearTimeout(agentState.timer);agentState.timer=null;}
  try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(e){}
  agentState.idx++;agentPlayStep();
}
function agentEnd(){
  if(agentState.tick){clearInterval(agentState.tick);agentState.tick=null;}
  try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(e){}
  var S=agentScript(agentState.scenario);
  if(!agentState.committed){agentState.committed=true;if(S.commit)S.commit();}
  agentState.phase="ended";renderAgent();
}
function agentReplay(){
  agentState.token=(agentState.token||0)+1;
  if(agentState.timer){clearTimeout(agentState.timer);agentState.timer=null;}
  if(agentState.tick)clearInterval(agentState.tick);
  try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(e){}
  agentState.phase="live";agentState.idx=0;agentState.started=Date.now();
  agentState.tick=setInterval(agentUpdateTimer,1000);agentPlayStep();
}
function agentStop(){
  agentState.token=(agentState.token||0)+1;
  if(agentState.timer){clearTimeout(agentState.timer);agentState.timer=null;}
  if(agentState.tick){clearInterval(agentState.tick);agentState.tick=null;}
  try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(e){}
}
function agentReset(){agentStop();agentState.phase="idle";agentState.idx=0;agentState.committed=false;agentState.orderId=null;renderAgent();}

  else if(act==="remove-site"){var si=parseInt(el.dataset.i,10);if(si>-1&&CUST_SITES[si]&&!CUST_SITES[si].primary){var rn=CUST_SITES[si].name;CUST_SITES.splice(si,1);if(cDraft.site>=CUST_SITES.length)cDraft.site=0;renderCustomer();toast("Site removed — "+rn);}}
  else if(act==="map-zoom"){var dir=el.dataset.dir;if(window.LMAP){if(dir==="in")LMAP.zoomIn();else if(dir==="out")LMAP.zoomOut();else if(window.LMAPBOUNDS)LMAP.fitBounds(window.LMAPBOUNDS,{padding:[30,30]});}}
  else if(act==="pay-all"){var n=0;orders.forEach(function(o){if(o.customer===CUSTOMER_ME&&o.status==="delivered"&&!o.paid){o.paid=true;n++;}});if(n){logEvent(n+" invoice(s) paid via MMG by "+CUSTOMER_ME);renderCustomer();toast(n+" invoice(s) paid");}}
},false);

document.addEventListener("input",function(e){if(e.target&&e.target.id==="litres"){var v=parseInt(e.target.value,10);if(v)cDraft.litres=v;var qv=document.querySelector(".total .v");if(qv)qv.textContent=gyd((v||0)*PRICE[cDraft.prod]);}});

/* ---------- LIVE phone orders (AI call agent -> demo) ----------
   Orders taken by the real AI phone agent appear here in real time.
   To turn it on, set LIVE.url to your orders endpoint (e.g. a Supabase REST
   URL). It must return JSON: an array of objects like
     {"id":"KI-2001","customer":"A.C.S. Guyana","product":"ulsd","litres":5000,"site":"Rose Hall, Corentyne (Region 6)","when":"Tomorrow 07:00"}
   Leave url empty to keep the demo offline/self-contained (default). */
var LIVE={url:"https://xqlwokgpozmikrsbglzw.supabase.co/rest/v1/orders?select=*&order=created_at.desc&limit=50",key:"sb_publishable_ae0cfqrdbPkDjz9KSj-iZg_dBGevJTj",pollMs:4000};
var liveSeen={},liveBaseline=false;
function liveBadge(){
  if(!LIVE.url||document.getElementById("livepill"))return;
  var b=document.querySelector(".brand");if(!b)return;
  var s=document.createElement("span");s.id="livepill";s.className="livepill";
  s.innerHTML='<span class="ld"></span>LIVE line';b.appendChild(s);
}
function liveMapProd(p){p=(p||"ulsd").toString().toLowerCase();return (p==="ulsd"||p==="lsd"||p==="gas")?p:"ulsd";}
function liveTick(){
  if(!LIVE.url)return;
  var headers={};if(LIVE.key){headers.apikey=LIVE.key;headers.Authorization="Bearer "+LIVE.key;}
  try{
    fetch(LIVE.url,{headers:headers}).then(function(r){return r.ok?r.json():null;}).then(function(rows){
      if(!rows)return;if(!Array.isArray(rows))rows=rows.orders||rows.data||[];
      if(!liveBaseline){rows.forEach(function(row){var id=row.id||row.order_id;if(id)liveSeen[id]=true;});liveBaseline=true;return;}
      var added=0;
      rows.forEach(function(row){
        var id=row.id||row.order_id;if(!id||liveSeen[id])return;liveSeen[id]=true;
        if(orders.some(function(o){return o.id===id;}))return;
        var prod=liveMapProd(row.product||row.prod);var L=parseInt(row.litres,10)||0;
        orders.unshift({id:id,customer:row.customer||"Phone order",prod:prod,litres:L,status:"pending",driver:null,addr:row.site||row.addr||"Corentyne (Region 6)",today:true,paid:false,eta:row.when||null,proof:null,viaPhone:true});
        logEvent("AI phone agent booked "+id+" — "+(row.customer||"caller")+" ("+PSHORT[prod]+" "+fmt(L)+" L)");
        added++;
      });
      if(added){if(state.role==="owner")renderOwner();else if(state.role==="agent")renderAgent();toast(added+" new phone order"+(added>1?"s":"")+" — live from the AI line");}
    }).catch(function(){});
  }catch(e){}
}
function liveStart(){if(!LIVE.url)return;liveBadge();liveTick();setInterval(liveTick,LIVE.pollMs);}

render();updateBell();liveStart();
</script>
